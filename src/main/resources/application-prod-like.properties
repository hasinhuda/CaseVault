# Prod-like profile: PostgreSQL, hardened cookies, security headers, meant to run BEHIND a reverse proxy.
#
# What this file does and does NOT do:
# - The application does NOT terminate TLS and has no certificate. It listens on plain HTTP on an INTERNAL port
#   (8080). TLS must be terminated by a reverse proxy in front of it (planned for Phase 12B); the application port
#   must not be published to the host or the internet.
# - Cookies are "Secure" and HSTS is sent, which only makes sense because the browser talks HTTPS to the proxy.
# - The proxy must set X-Forwarded-Proto, X-Forwarded-Host and X-Forwarded-For, and must OVERWRITE (not append to)
#   X-Forwarded-For with the address it saw ($remote_addr in nginx).
server.port=8080
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=15m

# Client address, scheme and host come from the proxy headers through Tomcat's remote IP handling. Only requests that
# arrive from an internal proxy address (default: private and loopback ranges; narrow it with
# server.tomcat.remoteip.internal-proxies) are believed. The right-most address that is not a proxy becomes the
# client address, so entries a client adds on the left are ignored. Do NOT combine this with
# casevault.ratelimit.trust-forwarded-for=true (the application refuses to start if you do).
server.forward-headers-strategy=native
casevault.ratelimit.trust-forwarded-for=false

# Docker/Compose secrets: a file /run/secrets/spring.datasource.password (file name = property name) supplies the
# database password. The directory is optional, so the profile still starts with environment variables only.
spring.config.import=optional:configtree:/run/secrets/

# Database. Host, port, name and user come from the environment (defaults below). There is NO default password: if
# neither POSTGRES_PASSWORD, SPRING_DATASOURCE_PASSWORD nor the secret file provides one, the application fails to
# start with "Could not resolve placeholder 'POSTGRES_PASSWORD'".
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:casevault}
spring.datasource.username=${POSTGRES_USER:casevault}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

casevault.bootstrap.credentials-dir=.local-data

# First-run accounts are OFF in this profile. To create the four standard accounts once (no demo data), set
# casevault.bootstrap.initial-accounts-enabled=true AND casevault.bootstrap.initial-credentials-file=<path>; the random
# passwords are written only to that file (owner-only permissions), never printed or logged.

# HSTS (max-age one year, includeSubDomains). Only meaningful behind https.
casevault.security.hsts-enabled=true
