# Prod-like profile (Strict HTTPS, PostgreSQL, hardened cookies)
server.port=8443
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=15m

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:casevault}
spring.datasource.username=${POSTGRES_USER:casevault}
spring.datasource.password=${POSTGRES_PASSWORD:casevault}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

casevault.bootstrap.credentials-dir=.local-data

