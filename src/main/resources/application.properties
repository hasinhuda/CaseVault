spring.application.name=casevault
server.port=8080

# Management & Health Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Session Cookie Security (Hard Rule 6)
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Multipart Upload Configuration (SR-11)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Encrypted evidence is outside the classpath and web root. Both locations are git-ignored.
casevault.storage.evidence-dir=.local-data/evidence
casevault.storage.keyset-path=.local-data/keys/evidence-keyset.json

# Database (Default in-memory H2 for development / test fallback)
spring.datasource.url=jdbc:h2:mem:casevault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Vendor-specific migrations (for example the PostgreSQL-only audit immutability trigger). A vendor
# location that does not exist (H2) is skipped.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-{vendor}

# Tamper-evident audit log (Phase 6A). The HMAC key is generated lazily on first use and is git-ignored.
casevault.audit.key-path=.local-data/keys/audit-hmac.key
# Recorder: "chained" (HMAC chain, default and wired into the application) or "logging" (Phase 5 placeholder log lines).
casevault.audit.recorder=chained

# In-process rate limiting (Phase 8A). Per node, in memory, lost on restart. Defaults are starting points, not tuned values.
casevault.ratelimit.enabled=true
# Only for a known reverse proxy that appends the real client address (planned for Phase 12). Never enable it otherwise:
# a client could then choose its own address.
casevault.ratelimit.trust-forwarded-for=false
casevault.ratelimit.max-tracked-keys=10000
casevault.ratelimit.login-limit=10
casevault.ratelimit.login-window-seconds=60
casevault.ratelimit.api-basic-limit=60
casevault.ratelimit.api-basic-window-seconds=60
casevault.ratelimit.search-limit=60
casevault.ratelimit.search-window-seconds=60
casevault.ratelimit.upload-limit=10
casevault.ratelimit.upload-window-seconds=60
casevault.ratelimit.report-write-limit=30
casevault.ratelimit.report-write-window-seconds=60

# Phase 8B: safe error handling. No messages, stack traces, exception names or binding errors in any error response.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Strict-Transport-Security is written only when this is true (prod-like profile). Browsers honour it over https only.
casevault.security.hsts-enabled=false

# Every log line carries the request correlation id (set by CorrelationIdFilter; "-" outside a request).
logging.pattern.level=%5p [cid=%X{correlationId:--}]
