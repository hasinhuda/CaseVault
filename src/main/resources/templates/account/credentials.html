<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: htmlhead('Update Credentials')}">
    <title>Update Credentials - CaseVault</title>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<div th:replace="~{layout :: appheader}"></div>

<div class="app-shell">
    <aside th:replace="~{layout :: appsidebar('dashboard')}"></aside>

    <main id="main-content" class="content-wrapper">
        <div class="page-header">
            <div>
                <h1>Update Credentials</h1>
                <p class="page-subtitle">Please enter your current or temporary password and choose a new secure password.</p>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}" role="alert"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}" role="status" aria-live="polite"></div>

        <div class="card form-card-max">
            <form th:action="@{/account/credentials}" th:object="${changePasswordRequestDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="currentPassword">Current or Temporary Password <span class="required">*</span></label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control" autocomplete="current-password" required/>
                    <div th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password <span class="required">*</span></label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" autocomplete="new-password" minlength="12" required/>
                    <small class="page-subtitle">Must be at least 12 characters, including uppercase, lowercase, numbers, and special characters.</small>
                    <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" minlength="12" required/>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Password</button>
                    <a th:href="@{/dashboard}" class="btn btn-secondary ml-8">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{layout :: appfooter}"></div>
</body>
</html>
