<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseVault - Secure Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="login-body">
<a href="#login-main" class="skip-link">Skip to login form</a>

<main id="login-main" class="login-card">
    <h1>CaseVault Access</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}" role="alert" aria-live="polite">
        Error message
    </div>

    <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}" role="status" aria-live="polite">
        Information message
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username"/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password"/>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
</main>
</body>
</html>
