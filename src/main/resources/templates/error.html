<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: htmlhead('Error')}">
    <title>Error - CaseVault</title>
</head>
<body class="login-body">
<a href="#error-main" class="skip-link">Skip to error details</a>

<main id="error-main" class="login-card form-card-max">
    <h1 th:text="${status != null ? 'HTTP ' + status : 'Error'}">Error</h1>

    <div class="alert alert-danger" role="alert">
        <strong th:text="${error != null ? error : 'An error occurred'}">Error Type</strong>
        <p th:text="${message != null and !#strings.isEmpty(message) ? message : 'The request could not be completed.'}" class="mt-16">Error explanation</p>
    </div>

    <div class="card">
        <div class="metadata-label">Incident Correlation ID (SR-15)</div>
        <code th:text="${correlationId != null ? correlationId : 'N/A'}" class="metadata-value">00000000-0000-0000-0000-000000000000</code>
        <p class="page-subtitle mt-16">Please provide this correlation ID to support or consult the tamper-evident audit logs.</p>
    </div>

    <div class="mt-16">
        <a th:href="@{/dashboard}" class="btn btn-primary btn-block">Return to Dashboard</a>
    </div>
</main>
</body>
</html>
