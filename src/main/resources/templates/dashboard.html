<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseVault - Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 32px;
        }
        h1 {
            color: #58a6ff;
            margin-top: 0;
        }
        .user-details {
            margin: 24px 0;
            line-height: 1.8;
        }
        .badge {
            background-color: #238636;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        button.logout-btn {
            background-color: #da3633;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button.logout-btn:hover {
            background-color: #b62324;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CaseVault Security Operations</h1>
    <div class="user-details">
        <p>Authenticated User: <strong th:text="${username}">user</strong></p>
        <p>Assigned Role: <span class="badge" th:text="${role}">ROLE</span></p>
        <p>Tenant Organization: <span th:text="${organisationId}">ORG</span></p>
    </div>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="logout-btn">Sign Out</button>
    </form>
</div>
</body>
</html>
