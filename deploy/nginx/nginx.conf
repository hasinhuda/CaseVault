# nginx reverse proxy for the CaseVault prod-like stack (Phase 12B).
# TLS is terminated here. The application port is never published; only this container is.
# Runs as a non-root user on an unprivileged port (8443) with a read-only root filesystem: every writable path is /tmp.
# The application sets the security headers (CSP x2, HSTS, nosniff, frame options, referrer policy, permissions policy,
# cross-origin policies, cache control, correlation id). nginx adds NONE of them, so nothing is duplicated or in conflict.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log /dev/stdout combined;
    sendfile on;
    keepalive_timeout 30s;
    gzip off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The application accepts 10 MB per file and 11 MB per request (spring.servlet.multipart); 12 MB leaves a small margin.
    client_max_body_size 12m;

    # TLS: 1.2 and 1.3 only, AEAD ciphers with forward secrecy, no session tickets. OpenSSL builds have no TLS compression.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Defence in depth only (the application limiter is the primary control: 10 login POSTs per minute per client).
    # Only POST /login is counted here; the limit is deliberately looser than the application's.
    map $request_method $login_post_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone $login_post_key zone=login_post:1m rate=60r/m;
    limit_req_status 429;

    upstream cvr_app {
        server cvr-app:8080;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;

        # Errors produced by nginx itself get plain pages without version or internal information.
        # Errors produced by the application are passed through unchanged (proxy_intercept_errors stays off).
        error_page 400 /_errors/400.html;
        error_page 413 /_errors/413.html;
        error_page 429 /_errors/429.html;
        error_page 502 503 504 /_errors/50x.html;
        location /_errors/ {
            internal;
            alias /etc/nginx/error_pages/;
        }

        # Only the unauthenticated liveness answer of the application is reachable from outside.
        location = /actuator/health {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://cvr_app;
        }
        location /actuator/ {
            return 404;
        }

        location = /login {
            limit_req zone=login_post burst=20 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://cvr_app;
        }

        location / {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://cvr_app;
        }
    }
}
